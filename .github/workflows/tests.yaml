


name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgtx_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run testGitHub
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pgtx_test

  benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgtx_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install wrk 
        run: |
          sudo apt install wrk

      - name: Run native mitata benchmark
        run: npx tsx benchmark.ts
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pgtx_test

      - name: Seed database for wrk
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d pgtx_test -c "
            DROP TABLE IF EXISTS bench_users;
            CREATE TABLE bench_users (id SERIAL PRIMARY KEY, name TEXT, balance INT);
            INSERT INTO bench_users (name, balance) 
            SELECT 'User ' || i, floor(random() * 1000) FROM generate_series(1, 1000) s(i);
          "

      - name: Run wrk HTTP benchmark
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pgtx_test
          PGMAX: 10
        run: |

          npx tsx server-postgresjs.ts &
          POSTGRES_PID=$!
          
          npx tsx server-pgtx.ts &
          PGTX_PID=$!
          
          sleep 3

          echo "Selecting 5 users Postgres.js (10000 conns)"
          wrk -t2 -c10000 -d10s --latency http://localhost:3001/users 

          echo "Selecting 5 users @m2k-5f/pgtx (10000 conns)"
          wrk -t2 -c10000 -d10s --latency http://localhost:3000/users 
          sleep 3

          echo "Selecting 5 users Postgres.js (1000 conns)"
          wrk -t2 -c1000 -d10s --latency http://localhost:3001/users

          echo "Selecting 5 users @m2k-5f/pgtx (1000 conns)"
          wrk -t2 -c1000 -d10s --latency http://localhost:3000/bench_users
          sleep 3

          echo "Selecting 5 users Postgres.js (200 conns)"
          wrk -t2 -c200 -d10s --latency http://localhost:3001/users
          echo "Selecting 5 users @m2k-5f/pgtx (200 conns)"
          wrk -t2 -c200 -d10s --latency http://localhost:3000/users
          sleep 2

          echo "Selecting 5 users Postgres.js (50 conns)"
          wrk -t2 -c50 -d10s --latency http://localhost:3001/users
          echo "Selecting 5 users @m2k-5f/pgtx (50 conns)"
          wrk -t2 -c50 -d10s --latency http://localhost:3000/users
          sleep 2

          # Test 5: Selecting 1 user (10000 conns)
          echo "Selecting 1 user Postgres.js (10000 conns)"
          wrk -t2 -c10000 -d10s --latency http://localhost:3001/user
          echo "Selecting 1 user @m2k-5f/pgtx (10000 conns)"
          wrk -t2 -c10000 -d10s --latency http://localhost:3000/user
          sleep 3

          # Test 6: Selecting 1 user (1000 conns)
          echo "Selecting 1 user Postgres.js (1000 conns)"
          wrk -t2 -c1000 -d10s --latency http://localhost:3001/user
          echo "Selecting 1 user @m2k-5f/pgtx (1000 conns)"
          wrk -t2 -c1000 -d10s --latency http://localhost:3000/user
          sleep 3

          # Test 7: Selecting 1 user (200 conns)
          echo "Selecting 1 user Postgres.js (200 conns)"
          wrk -t2 -c200 -d10s --latency http://localhost:3001/user
          echo "Selecting 1 user @m2k-5f/pgtx (200 conns)"
          wrk -t2 -c200 -d10s --latency http://localhost:3000/user
          sleep 2

          # Test 8: Selecting 1 user (50 conns)
          echo "Selecting 1 user Postgres.js (50 conns)"
          wrk -t2 -c50 -d10s --latency http://localhost:3001/user
          echo "Selecting 1 user @m2k-5f/pgtx (50 conns)"
          wrk -t2 -c50 -d10s --latency http://localhost:3000/user
          sleep 2

          # Test 9: Selecting 1 as res (10000 conns)
          echo "Selecting 1 as res Postgres.js (10000 conns)"
          wrk -t2 -c10000 -d10s --latency http://localhost:3001/simple
          echo "Selecting 1 as res @m2k-5f/pgtx (10000 conns)"
          wrk -t2 -c10000 -d10s --latency http://localhost:3000/simple
          sleep 3

          # Test 10: Selecting 1 as res (1000 conns)
          echo "Selecting 1 as res Postgres.js (1000 conns)"
          wrk -t2 -c1000 -d10s --latency http://localhost:3001/simple
          echo "Selecting 1 as res @m2k-5f/pgtx (1000 conns)"
          wrk -t2 -c1000 -d10s --latency http://localhost:3000/simple
          sleep 3

          # Test 11: Selecting 1 as res (200 conns)
          echo "Selecting 1 as res Postgres.js (200 conns)"
          wrk -t2 -c200 -d10s --latency http://localhost:3001/simple
          echo "Selecting 1 as res @m2k-5f/pgtx (200 conns)"
          wrk -t2 -c200 -d10s --latency http://localhost:3000/simple
          sleep 2

          # Test 12: Selecting 1 as res (50 conns)
          echo "Selecting 1 as res Postgres.js (50 conns)"
          wrk -t2 -c50 -d10s --latency http://localhost:3001/simple
          echo "Selecting 1 as res @m2k-5f/pgtx (50 conns)"
          wrk -t2 -c50 -d10s --latency http://localhost:3000/simple
          sleep 2

          # Cleanup
          kill -9 $POSTGRES_PID 2>/dev/null || true
          kill -9 $PGTX_PID 2>/dev/null || true